name: CI — Test, Docs & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ──────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.7  # keep in sync with the dev extra
      - run: ruff check .
      - run: ruff format --check .

  # ── Changes outside the documentation ─────────────────────────────
  # The tests are skipped when only documentation changed: in a pull
  # request, relative to its base branch; on main, since the last
  # successful run (so a red main stays red). Tags always run them.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes outside the documentation
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=HEAD^1  # first parent of the checked-out merge commit
          elif [ "$GITHUB_REF_TYPE" = branch ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$GITHUB_REF_NAME&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty') || base=""
            if [ -n "$base" ] && ! git merge-base --is-ancestor "$base" HEAD; then
              base=""
            fi
          fi
          if [ -z "$base" ]; then
            echo "No base to compare with: the tests run."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --no-renames --name-only "$base" HEAD)
          code=false
          while IFS= read -r file; do
            case "$file" in
              "") ;;
              docs/examples/*) code=true ;;  # example data, checked by the tests
              docs/* | assets/* | *.md | CITATION.cff) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          printf 'Changed since %s:\n%s\n\ncode=%s\n' "$base" "$files" "$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # ── Tests ─────────────────────────────────────────────────────────
  test:
    needs: changes
    # Runs unless the changes job reported documentation only (it also
    # runs if that job failed).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev,aeon,prophet,tglad,beast,changeforest,fluss]

      - name: Run tests
        run: pytest --tb=short -q

  # ── Build docs ────────────────────────────────────────────────────
  docs:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Also when the tests were skipped (documentation-only change).
    if: >-
      ${{ !cancelled() && needs.lint.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install doc dependencies
        run: pip install -e .[docs]

      - name: Build Sphinx HTML
        run: sphinx-build -W -b html docs docs/_build/html

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # ── Deploy docs to GitHub Pages ───────────────────────────────────
  deploy-docs:
    # Explicit result check: the implicit one would skip this job after
    # skipped tests.
    if: >-
      ${{ !cancelled() && needs.docs.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Publish to PyPI (only on version tags) ────────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docs]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
